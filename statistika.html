<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistika Penjualan Sapi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}
header{
    background:#8B4513;
    color:white;
    text-align:center;
    padding:20px;
}
.container{
    width:90%;
    margin:auto;
    padding:20px;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.card h3{
    margin-bottom:10px;
}
.card p{
    font-size:24px;
    font-weight:bold;
    color:#8B4513;
}
.chart{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
    background:white;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
th{
    background:#8B4513;
    color:white;
}
</style>
</head>

<body>

<header>
    <h1>Dashboard Statistika Penjualan Sapi</h1>
</header>

<div class="container">

<div class="cards">
    <div class="card">
        <h3>Total Penjualan</h3>
        <p id="total"></p>
    </div>

    <div class="card">
        <h3>Rata-rata</h3>
        <p id="rata"></p>
    </div>

    <div class="card">
        <h3>Tertinggi</h3>
        <p id="tertinggi"></p>
    </div>

    <div class="card">
        <h3>Terendah</h3>
        <p id="terendah"></p>
    </div>
</div>

<div class="chart">
    <canvas id="grafikSapi"></canvas>
</div>

<table>
<tr>
    <th>Bulan</th>
    <th>Jumlah Sapi Terjual</th>
</tr>
<tr><td>Januari</td><td>45</td></tr>
<tr><td>Februari</td><td>52</td></tr>
<tr><td>Maret</td><td>48</td></tr>
<tr><td>April</td><td>60</td></tr>
<tr><td>Mei</td><td>55</td></tr>
<tr><td>Juni</td><td>70</td></tr>
</table>

</div>

<script>
const data = [45,52,48,60,55,70];
const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun"];

const total = data.reduce((a,b)=>a+b,0);
const rata = (total/data.length).toFixed(2);

document.getElementById("total").innerHTML = total + " Ekor";
document.getElementById("rata").innerHTML = rata + " Ekor";
document.getElementById("tertinggi").innerHTML = Math.max(...data) + " Ekor";
document.getElementById("terendah").innerHTML = Math.min(...data) + " Ekor";

new Chart(document.getElementById("grafikSapi"),{
    type:'line',
    data:{
        labels:bulan,
        datasets:[{
            label:'Penjualan Sapi',
            data:data,
            fill:false,
            borderWidth:2
        }]
    },
    options:{
        responsive:true
    }
});
</script>

</body>
</html>
